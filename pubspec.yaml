name: nexo
description: "Nexo — App simple de finanzas personales"
publish_to: 'none'
version: 1.4.0+4

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.3.3+1
  path: ^1.9.0
  intl: ^0.20.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1
  # Permite abrir una BD sintetica en los tests de migracion, sin dispositivo.
  sqflite_common_ffi: ^2.3.3

flutter_launcher_icons:
  android: true
  # Estaba en false: los iconos de iOS nunca se generaron desde
  # assets/icon/icon.png, asi que el .ipa salia con el logo de Flutter.
  ios: true
  # iOS no acepta canal alfa en el icono de la app.
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  # Version a sangre para iOS: el icono original trae dibujado su propio
  # cuadrado redondeado, y como iOS aplica encima su mascara se veia un
  # borde dentro de otro. Android sigue usando el original, que ya maneja
  # su recorte con el icono adaptativo.
  image_path_ios: "assets/icon/icon_ios.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0B0C0D"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
    # Fuentes empaquetadas: google_fonts las toma de aca en vez de la red
    # (ver GoogleFonts.config.allowRuntimeFetching en main.dart).
    - assets/fonts/
